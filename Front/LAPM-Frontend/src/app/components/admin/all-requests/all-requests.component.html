<div class="bg-white rounded-2xl shadow-lg overflow-hidden">
    <div *ngIf="allRequests$ | async as requests; else loading">
      <div *ngIf="requests.length > 0; else noRequests" class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Request Details</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
              <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamps</th>
              <th scope="col" class="relative px-6 py-3"><span class="sr-only">Actions</span></th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let request of requests">
              <td class="px-6 py-4 whitespace-nowrap text-sm">
                <div class="font-medium text-gray-900">{{ request.computerName }}</div>
                <div class="text-gray-500">For: {{ request.domainUser }} | By: {{ request.requestor }}</div>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full" [ngClass]="statusColors[request.status]">
                  {{ request.status }}
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                <div>Requested: {{ request.requestTime | date:'short' }}</div>
                <div>Expires: {{ request.expirationTime | date:'short' }}</div>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium space-x-2">
                <ng-container *ngIf="request.status === 'Approved' || request.status === 'Applied'">
                  <button (click)="extend(request.id)" class="text-indigo-600 hover:text-indigo-900">Extend</button>
                  <button (click)="revoke(request.id)" class="text-red-600 hover:text-red-900">Revoke</button>
                </ng-container>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <ng-template #noRequests>
        <div class="text-center p-12"><h3 class="mt-2 text-sm font-medium text-gray-900">No requests found</h3></div>
      </ng-template>
    </div>
    <ng-template #loading>
      <div class="text-center p-12"><p class="text-gray-500 animate-pulse">Loading all requests...</p></div>
    </ng-template>
  </div>
